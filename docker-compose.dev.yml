version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hpwd-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hpwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hpwd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
