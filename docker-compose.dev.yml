version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hpwd-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hpwd
    # C12: bound to loopback only — the default (no host IP) publishes on
    # 0.0.0.0, i.e. every network interface, exposing default/weak
    # credentials to anything else on the same LAN/Wi-Fi. Nothing outside
    # this machine needs to reach these dev services directly.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hpwd-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # S3-compatible object storage for local dev, standing in for Cloudflare R2
  # (no R2 account exists yet). Same API, so only env values change in prod.
  minio:
    image: minio/minio
    container_name: hpwd-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
