name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hpwd
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # Re-review fix: `rate-limit.test.ts` (src/lib/__tests__/rate-limit.test.ts)
      # talks to a real Redis, no mocking — with no service here, REDIS_URL
      # points at an unreachable localhost:6379 and `rateLimit` fails open
      # (by design, for production safety — see rate-limit.ts), which makes
      # 4 of its 5 tests fail (only "fails open when Redis is unreachable"
      # itself would pass). `turbo test` could never have gone green on a
      # real CI run without this.
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hpwd
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-dummy-secret-not-real
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      R2_ENDPOINT: http://localhost:9000
      R2_BUCKET: hpwd
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_PUBLIC_URL: http://localhost:9000/hpwd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hpwd/db exec prisma generate

      # B3: the Build step below runs `next build`, which imports @hpwd/db
      # (transpiled — see next.config.ts's transpilePackages) and, before
      # this fix, statically prerendered `/` by querying the `Template`
      # table at build time. `prisma generate` only builds the client, it
      # never touches the database — this service starts a brand-new
      # Postgres with no schema at all, so without `migrate deploy` here,
      # `next build` failed with "The table public.Template does not
      # exist". `/` is now `force-dynamic` (see app/page.tsx) so a missing
      # table there degrades gracefully instead of failing the build, but
      # applying the real migrations here is still the correct fix — CI
      # should build against a schema that actually matches what
      # production runs.
      - name: Apply database migrations
        run: pnpm --filter @hpwd/db exec prisma migrate deploy

      # apps/worker/src/__tests__/ffmpeg.test.ts drives the real ffmpeg binary
      # and reports SKIPPED when it is absent (deliberately — a test that
      # passed without it would assert nothing). GitHub's ubuntu runner image
      # does not ship ffmpeg, so without this step the codec, container and
      # duration assertions would silently never run in CI.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run linting
        run: pnpm exec turbo lint

      - name: Run tests
        run: pnpm exec turbo test

      - name: Build
        run: pnpm --filter @hpwd/web build

  # Separate job: the Dockerfiles are the deployment contract and nothing
  # else in CI exercises them. They could not be built on the machine they
  # were written on — a corporate TLS proxy intercepts binaries.prisma.sh
  # (handled by the `corp_ca` build secret, which no CI runner needs) and the
  # disk there had under 12 GB free, which a workspace install exhausts. This
  # is where they get proven.
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built, not pushed: there is no registry and no server yet. The point
      # is that both images build at all, which is the part that silently
      # rots as dependencies move.
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          # A placeholder is correct here and only here: this proves the
          # build works, and the real origin is baked in at deploy time.
          # Shipping an image built with this value would put localhost in
          # every link preview — see docs/operations.md section 2.1.
          build-args: NEXT_PUBLIC_SITE_URL=https://example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the background-removal image
        uses: docker/build-push-action@v6
        with:
          context: ./services/rembg
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
